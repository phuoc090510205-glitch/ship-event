<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quảng cáo · Ship event</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 40%,#173f96,#050d24 72%);color:#e8f0ff;font-family:system-ui,sans-serif;overflow:hidden}
.bx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px;padding:16px;text-align:center}
.bx b{display:block;font-size:20px;text-shadow:0 0 12px #3fd8ff;margin-bottom:6px}.bx small{color:#bcd0ff}
.sp{width:46px;height:46px;border-radius:50%;border:4px solid #1f3d7a;border-top-color:#ffd23a;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
</style>
<!-- ===== MÃ QUẢNG CÁO MONETAG =====
     Dán các đoạn <script> lấy từ Monetag (nút "Get tag") vào ngay dưới dòng này:
     - Vignette Banner (vùng 12104333)
     - In-Page Push   (vùng 12104332)
     - OnClick        (vùng 12104331) — chỉ bật khi người chơi bấm bên trong khung này
-->
<!-- MONETAG-TAGS -->
<script src="https://quge5.com/88/tag.min.js" data-zone="300851" async data-cfasync="false"></script>
</head>
<body>
<div class="bx" id="ld"><div class="sp"></div><div><b>Đang tải quảng cáo…</b><small>Cảm ơn bạn đã ủng hộ Ship event!</small></div></div>
<script>
/* chưa dán mã Monetag (hoặc quảng cáo không tải được sau 6 giây) thì hiện quảng cáo của chính game thay vì quay vòng mãi */
(function(){var has=[].some.call(document.scripts,function(s){return s.src&&s.src.indexOf(location.host)<0});
function house(){var b=document.getElementById('ld');if(!b)return;b.innerHTML='<div style="font-size:64px">🚀</div><div><b>Shop khuyến mãi Ship event</b><small>Gói Đá ưu đãi · Thuyền trưởng mới · Vũ khí giới hạn</small><div style="margin-top:8px;font-size:11.5px;color:#ffd23a">'+(has?'Bạn vẫn nhận thưởng khi hết giờ':'Quảng cáo của các hãng sẽ hiện ở đây khi game được gắn mã Monetag')+'</div></div>'}
if(!has)house();else setTimeout(house,6000)})();
</script>
</body>
</html>
