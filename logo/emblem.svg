<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14306e"/>
      <stop offset=".55" stop-color="#0a1840"/>
      <stop offset="1" stop-color="#050b22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset=".45" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#c77a12"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#cfe6ff"/>
      <stop offset="1" stop-color="#6f93c9"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc4ff"/>
      <stop offset="1" stop-color="#3a5fa8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#ffd84a"/>
      <stop offset=".7" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ff3a1a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".46" r=".5">
      <stop offset="0" stop-color="#3fd8ff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#2a7dff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2a7dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="front"><rect x="-200" y="262" width="912" height="400" transform="rotate(-18 256 262)"/></clipPath>
    <clipPath id="badge"><path d="M256 20 L460 138 L460 374 L256 492 L52 374 L52 138 Z"/></clipPath>
  </defs>
  <!-- huy hiệu lục giác -->
  <path d="M256 20 L460 138 L460 374 L256 492 L52 374 L52 138 Z" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <circle cx="256" cy="236" r="230" fill="url(#glow)"/>
    <g fill="#ffffff">
      <circle cx="120" cy="150" r="3"/><circle cx="392" cy="120" r="2.5"/><circle cx="410" cy="300" r="3"/>
      <circle cx="98" cy="300" r="2"/><circle cx="170" cy="96" r="2"/><circle cx="350" cy="410" r="2.5"/>
      <circle cx="150" cy="400" r="2"/><circle cx="330" cy="80" r="1.8"/><circle cx="430" cy="210" r="1.8"/>
    </g>
    <!-- quỹ đạo phía sau -->
    <ellipse cx="256" cy="262" rx="190" ry="62" transform="rotate(-18 256 262)" fill="none" stroke="#3fd8ff" stroke-width="7" stroke-opacity=".35"/>
  </g>
  <path d="M256 20 L460 138 L460 374 L256 492 L52 374 L52 138 Z" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 44 L439 150 L439 362 L256 468 L73 362 L73 150 Z" fill="none" stroke="#ffd65a" stroke-opacity=".35" stroke-width="3" stroke-linejoin="round"/>
  <!-- lửa động cơ -->
  <g filter="url(#soft)" opacity=".9"><path d="M226 360 Q256 470 286 360 Z" fill="#ff8a2a"/></g>
  <path d="M232 352 Q256 452 280 352 Z" fill="url(#flame)"/>
  <path d="M196 340 Q208 400 220 340 Z" fill="url(#flame)" opacity=".85"/>
  <path d="M292 340 Q304 400 316 340 Z" fill="url(#flame)" opacity=".85"/>
  <!-- cánh -->
  <path d="M232 230 L120 330 L132 350 L200 334 L232 300 Z" fill="url(#wing)" stroke="#0b1838" stroke-width="5" stroke-linejoin="round"/>
  <path d="M280 230 L392 330 L380 350 L312 334 L280 300 Z" fill="url(#wing)" stroke="#0b1838" stroke-width="5" stroke-linejoin="round"/>
  <path d="M190 300 L204 352 L224 352 L226 300 Z" fill="#2c4f94" stroke="#0b1838" stroke-width="5" stroke-linejoin="round"/>
  <path d="M322 300 L308 352 L288 352 L286 300 Z" fill="#2c4f94" stroke="#0b1838" stroke-width="5" stroke-linejoin="round"/>
  <!-- thân tàu -->
  <path d="M256 88 C286 140 298 210 296 290 L286 356 L226 356 L216 290 C214 210 226 140 256 88 Z" fill="url(#hull)" stroke="#0b1838" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 104 C270 150 276 200 276 250 L256 262 Z" fill="#ffffff" opacity=".55"/>
  <!-- buồng lái -->
  <path d="M256 150 C270 172 272 200 268 222 L256 230 L244 222 C240 200 242 172 256 150 Z" fill="#3fe0ff" stroke="#0b1838" stroke-width="4"/>
  <path d="M256 160 C262 174 264 190 262 204 L256 200 Z" fill="#e8fdff" opacity=".9"/>
  <!-- sọc vàng -->
  <path d="M232 300 L280 300 L278 318 L234 318 Z" fill="url(#gold)" stroke="#0b1838" stroke-width="3"/>
  <!-- quỹ đạo phía trước (vắt ngang thân tàu) -->
  <g clip-path="url(#badge)">
    <ellipse cx="256" cy="262" rx="190" ry="62" transform="rotate(-18 256 262)" fill="none" stroke="#3fd8ff" stroke-width="7" clip-path="url(#front)"/>
    <circle cx="411.7" cy="183.9" r="20" fill="#3fd8ff" opacity=".35"/><circle cx="411.7" cy="183.9" r="11" fill="#ffffff"/>
  </g>
</svg>
